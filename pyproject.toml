[project]
name = "psdl1"
version = "0.1.0"
description = "DL1 original-shape input validation and product similarity candidates (G5 pending)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
]

[project.scripts]
psdl1-validate = "psdl1.data:main"

[project.optional-dependencies]
timm = ["timm>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psdl1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
